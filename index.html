<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заявление</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Times New Roman",serif;background:#3d3d3d;padding:20px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
.paper{background:#fdfcf7;width:100%;max-width:820px;padding:50px 60px 60px;box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative;color:#000;line-height:1.5;overflow:hidden}
.paper::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#8b0000,#d4af37,#8b0000);z-index:2}
.paper::after{content:"МВД";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:220px;font-weight:bold;color:rgba(26,58,139,.06);letter-spacing:30px;pointer-events:none;z-index:0}

/* Единственная печать — красная круглая, правый нижний угол */
.stamp{position:absolute;bottom:60px;right:50px;width:150px;height:150px;border:4px solid #c62828;border-radius:50%;color:#c62828;font-size:11px;font-weight:bold;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-12deg);opacity:.75;z-index:3;pointer-events:none;padding:15px;line-height:1.3}
.stamp::before{content:"";position:absolute;inset:9px;border:2px solid #c62828;border-radius:50%}
.stamp::after{content:"";position:absolute;inset:16px;border:1px dashed #c62828;border-radius:50%}
.stamp .org{font-size:9px;letter-spacing:1px;margin-bottom:3px}
.stamp .big{font-size:20px;letter-spacing:3px;margin:2px 0}
.stamp .sub{font-size:8px;letter-spacing:.5px;font-weight:normal}

.header{text-align:center;margin-bottom:30px;border-bottom:2px solid #000;padding-bottom:15px;position:relative;z-index:1}
.header h1{font-size:20px;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
.header .sub{font-size:12px;letter-spacing:1px;color:#555;font-style:italic}
.recip{text-align:right;margin:40px 0 35px;font-size:15px;line-height:1.8;position:relative;z-index:1}
.recip .ln{border-bottom:1px dotted #333;display:inline-block;min-width:280px;padding:0 5px}
.title{text-align:center;font-size:22px;font-weight:bold;letter-spacing:6px;text-transform:uppercase;margin:30px 0 35px;text-decoration:underline;text-underline-offset:8px;position:relative;z-index:1}
.fld{margin-bottom:22px;font-size:15px;position:relative;z-index:1}
.fld label{display:block;font-weight:bold;margin-bottom:5px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#333}
.fld input,.fld textarea,.fld select{width:100%;border:none;border-bottom:1px solid #333;background:transparent;font-family:"Times New Roman",serif;font-size:16px;padding:6px 2px;outline:none}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-bottom:2px solid #8b0000}
.fld textarea{border:1px solid #333;min-height:90px;resize:vertical;padding:8px;background:rgba(255,255,255,.5)}
.chk{display:flex;align-items:flex-start;gap:10px;margin-bottom:22px;font-size:15px;position:relative;z-index:1}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:#8b0000}
.sig{margin-top:45px;display:flex;justify-content:space-between;align-items:flex-end;gap:30px;position:relative;z-index:1}
.sig .sl{flex:1;border-bottom:1px solid #333;text-align:center;padding-bottom:4px;font-size:12px;color:#555}
.sig .dl{width:200px;border-bottom:1px solid #333;text-align:center;padding-bottom:4px;font-size:12px;color:#555}
.act{margin-top:40px;display:flex;gap:15px;justify-content:center;flex-wrap:wrap;position:relative;z-index:5}
.btn{font-family:"Times New Roman",serif;font-size:15px;padding:12px 32px;border:2px solid #8b0000;background:#8b0000;color:#fff;cursor:pointer;letter-spacing:2px;text-transform:uppercase;font-weight:bold;transition:.2s}
.btn:hover{background:#a50000;transform:translateY(-2px);box-shadow:0 5px 15px rgba(139,0,0,.4)}
.btn.sec{background:transparent;color:#8b0000}
.btn.sec:hover{background:#8b0000;color:#fff}
.res{margin-top:30px;padding:20px;border:2px dashed #8b0000;background:#fff5f5;display:none;font-size:15px;position:relative;z-index:1}
.res h3{color:#8b0000;margin-bottom:10px;letter-spacing:2px}
.res pre{white-space:pre-wrap;font-family:"Times New Roman",serif;line-height:1.6}
@media(max-width:700px){.paper{padding:35px 25px}.paper::after{font-size:110px;letter-spacing:15px}.stamp{width:110px;height:110px;bottom:30px;right:20px;font-size:9px;padding:10px}.stamp .big{font-size:14px}.stamp .org,.stamp .sub{font-size:7px}.header h1{font-size:15px;letter-spacing:1px}.title{font-size:17px;letter-spacing:3px}.recip{font-size:12px}.recip .ln{min-width:160px}}
</style>
</head>
<body>
<div class="paper">

<!-- Красная круглая печать — правый нижний угол -->
<div class="stamp">
  <span class="org">МВД РОССИИ</span>
  <span class="big">★</span>
  <span class="sub">Отдел № 42<br>г. Москва</span>
</div>

<div class="header">
  <h1>Официальное заявление</h1>
  <div class="sub">Форма № З-1 · Утверждена приказом № 42 от 01.04</div>
</div>

<div class="recip">
  Начальнику <span class="ln" id="rp">_______________</span><br>
  от гражданина(ки) <span class="ln" id="ap">_______________</span>
</div>

<div class="title">Заявление</div>

<form id="f">
  <div class="fld"><label>ФИО заявителя</label><input id="a" required placeholder="Иванов Иван Иванович"></div>
  <div class="fld"><label>Кому адресовано</label><input id="r" required placeholder="Начальнику отдела кадров Петрову П.П."></div>
  <div class="fld"><label>На кого жалуемся</label><input id="t" required placeholder="гражданин Сидоров С.С."></div>
  <div class="fld"><label>Суть заявления</label><textarea id="rs" required placeholder="Прошу принять меры в связи с..."></textarea></div>
  <div class="fld"><label>Требуемые меры</label><select id="ac">
    <option>привлечь к ответственности</option>
    <option>провести проверку</option>
    <option>разобраться в ситуации</option>
    <option>объявить выговор</option>
    <option>выдать справку</option>
    <option>рассмотреть в установленном порядке</option>
  </select></div>
  <div class="chk"><input type="checkbox" id="ag" required><label for="ag">Обязуюсь сообщать достоверные сведения. Об ответственности за заведомо ложный донос предупреждён(а). <em>(ст. 306 УК РФ, если бы это было всерьёз)</em></label></div>
  <div class="sig"><div class="sl">Подпись / расшифровка</div><div class="dl" id="dt">«___» _______ 20___ г.</div></div>
  <div class="act">
    <button class="btn">Подать заявление</button>
    <button type="reset" class="btn sec">Очистить</button>
  </div>
</form>

<div class="res" id="res"><h3>✓ Заявление зарегистрировано</h3><pre id="rt"></pre></div>
</div>

<script>
const $=id=>document.getElementById(id),f=$('f'),a=$('a'),r=$('r'),res=$('res'),rt=$('rt');
a.oninput=()=>$('ap').textContent=a.value.trim()||'_______________';
r.oninput=()=>$('rp').textContent=r.value.trim()||'_______________';
const d=new Date(),M=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
$('dt').textContent=`«${String(d.getDate()).padStart(2,'0')}» ${M[d.getMonth()]} ${d.getFullYear()} г.`;
f.onsubmit=e=>{
  e.preventDefault();
  const n='З-'+Math.floor(1000+Math.random()*9000);
  rt.textContent=`Входящий № ${n} от ${d.toLocaleDateString('ru-RU')}\n\nКому: ${r.value.trim()}\nОт: ${a.value.trim()}\n\nЗАЯВЛЕНИЕ\n\nПрошу ${$('ac').value} в отношении: ${$('t').value.trim()}.\n\nОбстоятельства: ${$('rs').value.trim()}\n\nПрошу рассмотреть в установленный законом срок и уведомить о решении.\n\nДата: ${$('dt').textContent}\nПодпись: ______________ / ${a.value.trim()} /\n\n———————————————————————\nДокумент сгенерирован в демонстрационных целях. Юридической силы не имеет.`;
  res.style.display='block';
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
};
f.onreset=()=>{
  res.style.display='none';
  $('ap').textContent='_______________';
  $('rp').textContent='_______________';
};
</script>
</body>
</html>
